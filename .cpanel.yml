---
deployment:
  tasks:
    - export REPOPATH=/home/peipostcards/git/
    - export DEPLOYPATH=/home/peipostcards/public_html/
    - /usr/bin/find $REPOPATH -path "$REPOPATH.git" -prune -o -type d -exec /bin/chmod 0755 {} +
    - /usr/bin/find $REPOPATH -path "$REPOPATH.git" -prune -o -type f -exec /bin/chmod 0644 {} +
    - /bin/rsync -rltDv --delete --link-dest=$REPOPATH --exclude='.git' --exclude='.cpanel.yml' --exclude='README.md' --exclude='.well-known' --exclude='cgi-bin' $REPOPATH $DEPLOYPATH
    - /bin/chmod 0755 $DEPLOYPATH
